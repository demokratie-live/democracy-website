  - id: build-component
    title: Create FeaturesShowcase client component
    description: |
      Create new-version/src/components/mdx/FeaturesShowcase.tsx as a "use client"
      component:
        - Internal FEATURES array with id, icon (lucide icon component),
          title, description (German copy matching current home.mdx),
          videoSrc, posterSrc.
        - useState<string>('waehle') for activeId (default = first feature).
        - useRef<HTMLVideoElement> for the <video>.
        - useEffect on activeId change: call video.load() then
          video.play().catch(()=>{}).
        - Layout: responsive 2-column grid on md+, stacked on mobile. Left:
          vertical list of <button>s. Right: <video autoPlay loop muted
          playsInline poster={...} src={...} className="...">.
        - Active button uses the same Tailwind classes as the existing
          FeatureCard `highlight` variant (primary-orange bg + white text);
          idle uses white/muted with border. Hover = subtle lift + border
          color change. No new dependencies.
        - Accessibility: role="tablist" on the button group, role="tab"
          + aria-selected on each button, role="tabpanel" on the video
          wrapper, aria-label on the <video>.
        - After a click, focus management stays on the clicked button and
          the video container is scrolled into view via
          element.scrollIntoView({ behavior: 'smooth', block: 'start' });
          the video container gets Tailwind `scroll-mt-[<navbar-height+50>]`
          so no pixel math is needed.
      Keep the file under 300 lines; extract no sub-components.
    wave: 1
    agent: gem-implementer
    prototype: false
    covers:
