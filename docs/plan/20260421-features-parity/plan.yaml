plan_id: 20260421-features-parity
objective: >-
  Rebuild the "Alle Funktionen von DEMOCRACY" section on the local homepage
  (new-version/) to match the behaviour of the live site
  (https://democracy-deutschland.de/#!home) — five clickable feature entries
  swapping a looping video on the right — but styled in the new brand design
  (primary-orange active state, white idle, no blue), using a static Next.js
  export and no new dependencies.
created_at: "2026-04-21"
created_by: gem-planner
status: pending
research_confidence: high

plan_metrics:
  wave_1_task_count: 4
  total_dependencies: 6
  risk_score: low

tldr: |
  Add a new client-side `FeaturesShowcase` component that renders a vertical
  list of five brand-styled buttons and a synchronized <video> element. Copy the
  five MP4 assets (plus optional PNG posters) into public/videos/, register the
  component in the MDX registry, replace the current static Grid/FeatureCard/img
  block in home.mdx, then validate via lint/content/build/e2e and a browser
  parity check against the live site.

open_questions: []

gaps: []

pre_mortem:
  overall_risk_level: low
  critical_failure_modes:
    - scenario: >-
        Autoplay with sound-off fails on iOS Safari because `muted` or
        `playsInline` attributes are missing after the React-controlled src
        swap, breaking the core interaction.
      likelihood: medium
      impact: high
      mitigation: >-
        Keep `muted`, `playsInline`, `autoPlay`, `loop` on the <video> element;
        on activeId change call `video.load()` then `video.play().catch(()=>{})`
        inside useEffect. Verify on a mobile viewport via browser-tester.
    - scenario: >-
        Smooth-scroll offset miscalculates against the fixed navbar and scrolls
        past / short of the video, producing a worse UX than the live site.
      likelihood: medium
      impact: medium
      mitigation: >-
        Prefer CSS `scroll-margin-top` on the video container (value matching
        the existing navbar height token) and use
        `element.scrollIntoView({ behavior: 'smooth', block: 'start' })` instead
        of computing offsets by hand.
    - scenario: >-
        Videos are committed as-is and inflate the static export / git repo
        size, or poster generation requires ffmpeg which is not available in
        the environment.
      likelihood: medium
      impact: low
      mitigation: >-
        Copy only the 5 required MP4s into public/videos/. Attempt ffmpeg for
        posters; on failure, fall back to the existing /files/images/*.png as
        posters and log the decision in the task notes.
  assumptions:
    - "new-version uses Next.js App Router with output: 'export' (static export)."
    - "pnpm is the only supported package manager; scripts lint / validate-content / build / test:e2e exist in new-version/package.json."
    - "Existing FeatureCard highlight variant already encodes the primary-orange brand token; the new buttons can reuse the same Tailwind classes."
    - "MDX components are registered centrally in new-version/src/components/mdx/MDXComponents.tsx."
    - "The five MP4 files in the session-state files directory are the final assets and are safe to commit to the repo."

implementation_specification:
  code_structure: >-
    One new client component
    (new-version/src/components/mdx/FeaturesShowcase.tsx) owning local state
    (activeId), a ref to a single <video>, and an internal FEATURES array
    (id, icon, title, description, videoSrc, posterSrc). Registered in the MDX
    components map and consumed from home.mdx replacing the current
    Grid/FeatureCard/img block. Assets live under new-version/public/videos/.
  affected_areas:
    - new-version/src/components/mdx/FeaturesShowcase.tsx (new)
    - new-version/src/components/mdx/MDXComponents.tsx (registry entry)
    - new-version/content/pages/home.mdx (lines ~36–72 replaced)
    - new-version/public/videos/*.mp4 (+ optional *.png posters)
  component_details:
    - component: FeaturesShowcase
      responsibility: >-
        Render 5 brand-styled feature buttons + a synchronized looping muted
        video, handle active state, swap src on click, smooth-scroll to the
        video on mobile.
      interfaces:
        - 'default export: () => JSX.Element (no props; data is internal)'
      dependencies:
        - component: react
          relationship: useState/useRef/useEffect hooks
        - component: lucide-react
          relationship: reuse the same icons currently used in FeatureCard
      integration_points:
        - Mounted via MDX through mdxComponents registry
        - Consumes Tailwind tokens already defined for the `highlight` variant
    - component: MDXComponents registry
      responsibility: Expose FeaturesShowcase to MDX files by tag name.
      interfaces:
        - 'export const mdxComponents: MDXComponents'
      dependencies:
        - component: FeaturesShowcase
          relationship: imported and registered under key "FeaturesShowcase"
      integration_points:
        - Consumed by the MDX renderer that pages rely on
    - component: home.mdx
      responsibility: Replace the static features block with <FeaturesShowcase />.
      interfaces: []
      dependencies:
        - component: FeaturesShowcase
          relationship: rendered via MDX tag
      integration_points:
        - Static page build at /

contracts:
  - from_task: copy-assets
    to_task: build-component
    interface: >-
      Files exist at new-version/public/videos/DDW-{List,info,vote,compare,analyse}_croped.mp4
      (and matching .png posters if ffmpeg succeeded, otherwise documented
      fallback PNG path).
    format: filesystem paths, referenced by string literals in FEATURES array
  - from_task: build-component
    to_task: register-and-embed
    interface: >-
      `FeaturesShowcase` default export is a client component taking no props
      and rendering the full section.
    format: TypeScript React component module
  - from_task: register-and-embed
    to_task: validate-build
    interface: >-
      home.mdx renders <FeaturesShowcase /> and the old Grid/FeatureCard/img
      block is removed; MDXComponents exports the new tag.
    format: MDX + TS source
  - from_task: validate-build
    to_task: browser-parity
    interface: Clean `pnpm build` static export + passing e2e smoke.
    format: build artefacts under new-version/out/ (or equivalent)

